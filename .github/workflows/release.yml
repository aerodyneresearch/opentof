name: Publish to PyPI

# Production release workflow: builds the package and publishes it to PyPI
# via Trusted Publishing (OIDC) — no API token or password required.
#
# Tag-driven only: publishing happens when you push a tag matching
# release_v* (e.g. release_v0.1.0). The distinctive prefix makes a release a
# deliberate act — an ordinary vX.Y.Z tag will NOT trigger it. Matches the
# release_v* tag restriction set on the "pypi" GitHub environment.

on:
  push:
    tags:
      - "release_v*"

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    # Must match the "Environment name" on the PyPI trusted publisher (pypi)
    # and the GitHub environment (Settings -> Environments -> pypi).
    environment:
      name: pypi
      url: https://pypi.org/project/opentof/

    permissions:
      # Required to clone the repo. Specifying any permission sets all
      # unlisted ones to "none", so this must be listed explicitly.
      contents: read
      # Required for Trusted Publishing — lets GitHub mint the OIDC token.
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build source distribution and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No repository-url: defaults to the real PyPI (upload.pypi.org).
